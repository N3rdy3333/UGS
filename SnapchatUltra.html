<style>
:root{--bg:#0b0b0c;--panel:#151517;--card:#1e1e21;--line:#2b2b30;--mut:#9b9ba4;--blue:#0fadff;--red:#f23c57;--yel:#fffc00}
*{box-sizing:border-box;margin:0;font-family:"Avenir Next",Inter,Helvetica,Arial,sans-serif}
html,body{height:100%;background:var(--bg);color:#fff}
button{cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
input{font-size:16px;color:#fff}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#33333a;border-radius:8px}
#app{height:100%;display:flex}
/* auth */
.authwrap{margin:auto;width:100%;max-width:420px;padding:24px}
.auth{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:34px 30px;text-align:center;box-shadow:0 20px 60px #000a}
.auth h1{font-size:26px;margin:14px 0 4px}.auth .sub{color:var(--mut);font-size:14px;margin-bottom:18px}
.auth input,.field{width:100%;padding:14px 16px;margin:6px 0;border:1px solid var(--line);border-radius:14px;background:#0e0e10;outline:0;transition:.15s}
.auth input:focus,.field:focus,.bar input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0fadff30}
.auth label{display:block;text-align:left;font-size:12px;color:var(--mut);margin:8px 0 0 4px}
.btn{display:block;width:100%;padding:14px;margin-top:14px;border-radius:30px;background:var(--yel);color:#000;font-weight:800;font-size:16px;transition:.15s}
.btn:hover{filter:brightness(.93)}.btn.blue{background:var(--blue);color:#fff}.btn.gray{background:#2a2a2f;color:#fff}.btn.red{background:#3a1f25;color:#ff6b81}
.err{color:#ff6b81;font-size:14px;min-height:20px;margin-top:8px}
.link{color:var(--blue);font-weight:700;margin-top:16px}
/* sidebar */
.side{width:380px;display:flex;flex-direction:column;flex-shrink:0;background:var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.ib{width:38px;height:38px;border-radius:50%;background:#26262b;display:grid;place-items:center}
.ib.blue{background:var(--blue)}.ib:hover{filter:brightness(1.2)}
.meb{position:relative}.meb .gear{position:absolute;right:-2px;bottom:-2px;background:#26262b;border-radius:50%;width:16px;height:16px;display:grid;place-items:center;font-size:10px}
.banner{margin:0 0 4px;background:linear-gradient(90deg,#0fadff,#1a8cff);padding:14px 16px;display:flex;gap:12px;align-items:center;font-size:13px;line-height:1.35}
.banner b{display:block;font-size:16px}.banner .x{margin-left:auto;font-size:18px}
.search{margin:10px 14px;display:flex;align-items:center;gap:8px;background:#232327;border-radius:22px;padding:0 14px}
.search input{flex:1;background:none;border:0;outline:0;padding:12px 0}
.search:focus-within{box-shadow:0 0 0 2px var(--blue)}
.stories{display:flex;gap:14px;padding:12px 16px;overflow-x:auto;border-bottom:1px solid var(--line)}
.stories::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;min-width:58px;cursor:pointer}
.ring{padding:3px;border-radius:50%;border:2px solid #3a3a40}.ring.new{border-color:var(--blue)}
.st span{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{flex:1;overflow:auto}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;border-bottom:1px solid #1c1c20}
.row:hover{background:#1a1a1d}.row.on{background:#222226}
.row b{display:block;font-size:17px;font-weight:600}
.row small{color:var(--mut);font-size:13px;display:flex;align-items:center;gap:6px;margin-top:3px}
.sq{width:11px;height:11px;border-radius:3px;border:2px solid var(--red);display:inline-block}.sq.new{background:var(--blue);border-color:var(--blue)}
.ar{width:0;height:0;border:5px solid transparent;border-left:9px solid var(--red);border-right:0;display:inline-block}
.cam{margin-left:auto;text-align:center;font-size:10px;font-weight:700}
.cam i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;margin:auto;font-style:normal;color:var(--mut)}
.cam.new i{color:#fff;background:#33333a}
.lbl{padding:14px 16px 6px;color:var(--mut);font-size:12px;font-weight:700;letter-spacing:.6px}
/* main */
.main{flex:1;margin:8px 8px 8px 0;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative}
.empty{margin:auto;text-align:center;color:var(--mut);padding:30px}
.head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.head b{font-size:18px}.head small{display:block;color:var(--mut);font-size:13px}
.msgs{flex:1;overflow:auto;padding:12px 18px 18px}
.g{border-left:3px solid;margin:14px 0 4px 6px;padding-left:12px}.g.me{border-color:var(--red)}.g.them{border-color:var(--blue)}
.gh{display:flex;justify-content:space-between;max-width:560px;margin:-2px 0 6px -2px;font-size:12px;font-weight:800;letter-spacing:.3px}
.g.me .gh b{color:var(--red)}.g.them .gh b{color:var(--blue)}.gh span{color:var(--mut);font-weight:500}
.m{display:inline-block;clear:both;max-width:560px;padding:9px 14px;margin:2px 0;border:1px solid var(--line);border-radius:6px;font-size:16px;line-height:1.35;white-space:pre-wrap;word-break:break-word;background:#19191c}
.mw{display:flex;align-items:center;gap:8px}
.pen{opacity:0;font-size:13px;color:var(--mut);padding:2px 6px;border-radius:8px}.mw:hover .pen,.pen:focus{opacity:1}.pen:hover{color:#fff}
@media(hover:none){.pen{opacity:.7}}
.edtag{font-size:11px;color:var(--mut);text-decoration:underline;padding:2px}.edtag:hover{color:#fff}
.ed{display:flex;gap:6px;align-items:center;flex:1;max-width:560px}
.ed input{flex:1;padding:9px 12px;border-radius:6px;border:1px solid var(--blue);background:#0e0e10;outline:0}
.ed .ib{width:34px;height:34px}.ed .ib.ok{background:var(--blue)}
.ver{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;white-space:pre-wrap;word-break:break-word}
.ver small{display:block;color:var(--mut);font-size:12px;margin-bottom:4px}.ver.cur{border-color:var(--blue)}
.bar{display:flex;gap:10px;padding:12px 16px;align-items:center;position:relative}
.bar input{flex:1;border:1px solid transparent;border-radius:26px;padding:13px 18px;outline:0;background:#26262b}
.emo{position:absolute;right:16px;bottom:66px;background:#26262b;border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:24px;z-index:5}
.emo button{padding:4px;border-radius:8px}.emo button:hover{background:#38383f}
.back{display:none}

.gen{display:flex;gap:10px;margin:6px 0}.gen button{flex:1;padding:12px;border-radius:14px;background:#2a2a2f;border:2px solid transparent;font-weight:700;color:#fff;font-size:15px}.gen button.on{border-color:var(--blue);box-shadow:0 0 0 2px #0fadff55}.gprev{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0;color:var(--mut);font-size:13px;font-weight:600}
.hero{text-align:center;padding:10px 0 6px}.hero h2{margin-top:10px;font-size:24px}.hero p{color:var(--mut)}
.card{background:var(--card);border-radius:18px;padding:6px 18px;margin:14px 0;border:1px solid var(--line)}
.card.pad{padding:16px 18px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}

.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 4px;padding-bottom:4px}

.opt{margin:14px 0 6px}.opt p{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:8px;letter-spacing:.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-width:38px;height:38px;padding:0 14px;border-radius:19px;background:#2a2a2f;border:2px solid transparent;font-size:13px;font-weight:600}
.chip.sw{width:38px;padding:0;border-color:#0004}.chip.on{border-color:var(--blue);box-shadow:0 0 0 2px #0fadff55}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 20px;border-radius:22px;font-size:14px;font-weight:600;z-index:9}
.ov{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:20;padding:12px}
.sv{width:min(420px,100%);height:min(740px,94vh);border-radius:22px;position:relative;display:flex;flex-direction:column;overflow:hidden;color:#111;box-shadow:0 20px 70px #000}
.pbs{display:flex;gap:4px;padding:12px 14px 0;position:relative;z-index:2}
.pb{flex:1;height:3px;border-radius:3px;background:#0003;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:#fff}.pb i.full{width:100%}.pb i.run{animation:fill 5s linear forwards}

.svh{display:flex;align-items:center;gap:10px;padding:12px 14px;position:relative;z-index:2;color:#fff;text-shadow:0 1px 4px #0006}
.svh small{display:block;font-size:12px;opacity:.9}.svh .ib{margin-left:auto;background:#0004;color:#fff}
.svt{flex:1;display:grid;place-items:center;text-align:center;padding:28px;font-size:28px;font-weight:800;line-height:1.25;color:#fff;text-shadow:0 2px 10px #0005;white-space:pre-wrap;word-break:break-word}
.nv{position:absolute;top:90px;bottom:0;width:40%;z-index:1}.nv.l{left:0}.nv.r{right:0}
.sm{width:min(440px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}
.smh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.smh b{font-size:20px}
.mut{color:var(--mut);font-size:13px;margin:4px 0 10px}
.sc{border-radius:14px;padding:16px;margin:8px 0;color:#fff;font-weight:700;text-shadow:0 1px 6px #0005;display:flex;gap:10px;align-items:flex-start;white-space:pre-wrap;word-break:break-word}
.sc div{flex:1}.sc small{display:block;font-weight:500;opacity:.9;margin-top:6px}
.sc button{background:#0005;border-radius:50%;width:32px;height:32px;flex-shrink:0}
.sm textarea{width:100%;min-height:90px;resize:none;padding:12px 14px;margin-top:8px;border:1px solid var(--line);border-radius:14px;background:#0e0e10;color:#fff;font-size:16px;outline:0}
.sm textarea:focus{border-color:var(--blue)}
.plus{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:15px;line-height:1;border:2px solid var(--bg)}
.ring.mine{border-color:var(--yel)}.ring.seen{border-color:#55555d}
@media(max-width:760px){.side{width:100%}.main{display:none;margin:0;border-radius:0}.chatopen .side{display:none}.chatopen .main{display:flex}.back{display:grid}}

const WS=['fuck','phuck','shit','bullshit','bitch','cunt','nigger','nigga','faggot','retard','whore','slut','pussy','bastard','asshole','motherfucker','wetback','wanker','bollocks','dickhead','dumbass','jackass','cocksucker','tranny','towelhead','raghead','zipperhead','jigaboo','porchmonkey','sandnigger'];
const WW=['ass','arse','piss','cock','dick','twat','fag','cum','prick','kike','spic','chink','gook','coon','dyke','paki','beaner','fuk','fck'];
const ALLOW=['scunthorpe','shiitake','shitake','retardant','assassin','assess','assist','assume','assign','associate','assembly','classic','passage','massage','bassist','cocktail','peacock','hancock','dickens','dickinson'];
const rxw=(w,sep)=>w.split('').map(c=>c+'+').join(sep?'[._\\-*]*':'');
const SUBR=new RegExp(WS.map(w=>rxw(w,1)).join('|'));
const WRDR=new RegExp('(^|[^a-z0-9])('+WW.map(w=>rxw(w,0)).join('|')+')(s|es)?($|[^a-z0-9])');
const LT={'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','@':'a','$':'s','!':'i','+':'t'};
const bad=t=>{if(!t)return false;let p=String(t).normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase();
 ALLOW.forEach(a=>{p=p.split(a).join(' ')});
 const full=p.replace(/[0134578@$!+]/g,c=>LT[c]),sym=p.replace(/[@$!+]/g,c=>LT[c]);
 return [p,full].some(v=>SUBR.test(v))||[p,sym].some(v=>WRDR.test(v))};
const san=u=>{if(u.displayName&&bad(u.displayName))u.displayName='Snapchatter';if(u.username&&bad(u.username))u.username='user_'+String(u.id||'').slice(0,5);return u};

 msgUnsub&&msgUnsub();window.msgs=[];
 msgUnsub=onValue(query(ref(db,'messages/'+cid(me.id,o)),orderByChild('ts')),x=>{
  const a=[];x.forEach(c=>{a.push({id:c.key,...c.val()})});window.msgs=a;renderMain(true);markSeen()},()=>{});
 render();}
async function markSeen(){const c=chats.find(x=>x.other==active);
 if(c&&c.lastFrom!==me.id&&c.lastTs>(c.seen||0))update(ref(db,`userChats/${me.id}/${active}`),{seen:Date.now()}).catch(()=>{})}

function renderMain(keep){const m=$('#main');if(!m)return;
 if(showFriend)return renderFriend(m);
 if(view=='profile'&&!active)return renderProfile(m);
 if(!active){m.innerHTML=`<div class="empty"><div style="margin-bottom:12px">${ghost(110)}</div><p style="font-size:18px;font-weight:700;color:#fff">Welcome to Snapchat Ultra</p><p>Select a chat or search a username to start</p></div>`;return}
 const u=U[active]||{},prev=$('#in')?.value||'',f=document.activeElement?.id=='in',fe=document.activeElement?.id=='ei';
 const groups=[];(window.msgs||[]).forEach(x=>{const g=groups[groups.length-1];if(g&&g.from==x.from)g.items.push(x);else groups.push({from:x.from,t:x.ts,items:[x]})});
 const body=groups.map(g=>{const mine=g.from==me.id;return`<div class="g ${mine?'me':'them'}"><div class="gh"><b>${mine?'ME':esc((u.displayName||'').toUpperCase())}</b><span>${clock(g.t)}</span></div>${g.items.map(x=>msgHtml(x,mine)).join('')}</div>`}).join('');
 m.innerHTML=`<div class="head"><button class="ib back" id="bk">‹</button><button id="hp">${avatar(u.avatar,42)}</button><div><b>${esc(u.displayName)}</b><small>@${esc(u.username)}</small></div></div>
  <div class="msgs" id="ms">${body||`<div class="empty">Say hi to ${esc(u.displayName)} 👋</div>`}</div>
  <form class="bar" id="fm"><input id="in" placeholder="Send a chat" autocomplete="off" value="${esc(prev)}"><button type="button" class="ib" id="eb">${IC.emo}</button>
  ${emoOpen?`<div class="emo">${EMO.map(e=>`<button type="button" data-e="${e}">${e}</button>`).join('')}</div>`:''}</form>`;
 const ms=$('#ms');ms.scrollTop=ms.scrollHeight;
 if(editing){const ei=$('#ei');if(ei&&(fe||editing.fresh)){ei.focus();ei.setSelectionRange(ei.value.length,ei.value.length);editing.fresh=false}}else if(f||keep===undefined)$('#in').focus();
 $('#bk').onclick=()=>{active=null;editing=null;msgUnsub&&msgUnsub();render()};
 $('#hp').onclick=()=>{showFriend=active;renderMain()};
 $('#eb').onclick=()=>{emoOpen=!emoOpen;renderMain(true);$('#in').focus()};
 m.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{$('#in').value+=b.dataset.e;$('#in').focus()});
 m.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const x=(window.msgs||[]).find(y=>y.id==b.dataset.ed);if(x){editing={id:x.id,val:x.text,fresh:true};renderMain(true)}});
 m.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm("Delete this message? This can't be undone."))return;
  if(editing&&editing.id==b.dataset.del)editing=null;
  remove(ref(db,`messages/${cid(me.id,active)}/${b.dataset.del}`)).catch(e=>toast('Delete failed: '+e.message))});
 m.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>showHistory(b.dataset.h));
 const ei=$('#ei');if(ei){ei.oninput=()=>{if(editing)editing.val=ei.value};
  ei.onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();saveEdit()}else if(e.key=='Escape'){editing=null;renderMain(true)}};
  $('#es').onclick=saveEdit;$('#ec').onclick=()=>{editing=null;renderMain(true)}}
 $('#fm').onsubmit=async e=>{e.preventDefault();const t=$('#in').value.trim();if(!t)return;$('#in').value='';
  const id=cid(me.id,active),now=Date.now(),a=active;
  try{await set(push(ref(db,'messages/'+id)),{from:me.id,text:t,ts:now});
   await update(ref(db),{[`userChats/${me.id}/${a}/lastText`]:t,[`userChats/${me.id}/${a}/lastFrom`]:me.id,[`userChats/${me.id}/${a}/lastTs`]:now,[`userChats/${me.id}/${a}/seen`]:now,
    [`userChats/${a}/${me.id}/lastText`]:t,[`userChats/${a}/${me.id}/lastFrom`]:me.id,[`userChats/${a}/${me.id}/lastTs`]:now});
   update(ref(db,'users/'+me.id),{score:increment(1)});
  }catch(e){toast('Failed: '+e.message)}};
}
function profInfo(u,own){return`<div class="card"><div class="kv"><span>Snap Score</span><b>🔥 ${u.score||0}</b></div><div class="kv"><span>Birthday</span><b>${fmtB(u.birthday)}</b></div><div class="kv"><span>Zodiac</span><b>${zodiac(u.birthday)}</b></div><div class="kv"><span>Gender</span><b>${u.gender=='male'?'♂ Male':u.gender=='female'?'♀ Female':'Not set'}</b></div>${own?`<div class="kv"><span>Email</span><b>${esc(auth.currentUser?.email)}</b></div>`:''}</div>`}
function renderFriend(m){const u=U[showFriend]||{};
 m.innerHTML=`<div class="head"><button class="ib back" style="display:grid" id="bk">‹</button><b>Profile</b></div><div class="prof"><div class="hero">${avatar(u.avatar,150,1)}<h2>${esc(u.displayName)}</h2><p>@${esc(u.username)}</p></div>${profInfo(u)}<button class="btn blue" id="ch">Chat</button></div>`;
 $('#bk').onclick=()=>{showFriend=null;render()};$('#ch').onclick=()=>{showFriend=null;renderMain()};
}

/* ---------- own profile + character editor ---------- */
function renderProfile(m){const a={...defAv(),...me.avatar};
 if(editor)return renderEditor(m,a);
 m.innerHTML=`<div class="head"><button class="ib back" style="display:grid" id="bk">‹</button><b>My Profile</b></div><div class="prof">
 <div class="hero">${avatar(a,150,1)}<h2>${esc(me.displayName)}</h2><p>@${esc(me.username)}</p></div>${profInfo(me,1)}
 <button class="btn blue" id="vs">📖 ${actS(me.id).length?'View my story':'Post a story'}</button>
 <button class="btn gray" id="oe">✏️ Edit your character</button>
 <div class="card pad"><b style="font-size:18px">Edit info</b>
  <input class="field" id="edn" placeholder="Display name" value="${esc(me.displayName)}">
  <div style="font-size:12px;color:var(--mut);margin:8px 0 0 4px">Birthday</div><input class="field" id="ebd" type="date" value="${esc(me.birthday||'')}">
  <div style="font-size:12px;color:var(--mut);margin:8px 0 4px 4px">Gender</div><div class="gen" id="eg"><button type="button" data-g="male" class="${me.gender=='male'?'on':''}">♂ Male</button><button type="button" data-g="female" class="${me.gender=='female'?'on':''}">♀ Female</button></div>
  <button class="btn" id="sv">Save Changes</button></div>
 <button class="btn red" id="lo">Log Out</button><div style="height:30px"></div></div>`;
 $('#bk').onclick=()=>{view='chat';render()};
 $('#oe').onclick=()=>{editor=true;renderMain()};
 $('#vs').onclick=()=>actS(me.id).length?showStory(me.id,0):manageStory();
 let eg=me.gender||'';$('#eg').querySelectorAll('button').forEach(b=>b.onclick=()=>{eg=b.dataset.g;$('#eg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b))});
 $('#sv').onclick=async()=>{const dn=$('#edn').value.trim();if(!dn)return toast('Name cannot be empty');
  if(bad(dn))return toast('That name has language that is not allowed');
  await update(ref(db,'users/'+me.id),{displayName:dn,birthday:$('#ebd').value,...(eg?{gender:eg}:{})});if(eg)me.gender=eg;renderProfile($('#main'));toast('Saved ✓')};
 $('#lo').onclick=()=>signOut(auth);
}
function renderEditor(m,a){const sc=$('.prof')?.scrollTop||0,[,groups]=CATS[edTab];
 const chip=(k,i,v)=>{const on=a[k]==i,arr=Array.isArray(v),sw=arr||String(v).startsWith('#');
  return`<button class="chip ${sw?'sw':''} ${on?'on':''}" data-k="${k}" data-i="${i}" ${sw?`style="background:${arr?`linear-gradient(135deg,${v[0]},${v[1]})`:v}"`:''}>${sw?'':v}</button>`};
 m.innerHTML=`<div class="head"><button class="ib" style="display:grid" id="ex" title="Close" aria-label="Close editor">✕</button><b>Edit your character</b></div><div class="prof">
 <div class="hero">${avatar(a,120,1)}</div>
 <div class="card pad">
  <div class="tabs">${CATS.map((c,i)=>`<button class="tab ${i==edTab?'on':''}" data-t="${i}">${c[0]}</button>`).join('')}</div>
  ${groups.map(([k,label,vals])=>`<div class="opt"><p>${label}</p><div class="chips">${vals.map((v,i)=>chip(k,i,v)).join('')}</div></div>`).join('')}
  <button class="btn gray" id="rnd">🎲 Randomize</button><button class="btn gray" id="rst">↺ Reset to ${me.gender=='female'?'female':'male'} default</button></div>
 <button class="btn" id="dn">Done</button><div style="height:30px"></div></div>`;
 $('.prof').scrollTop=sc;
 const setAv=na=>{me.avatar=na;renderProfile($('#main'));update(ref(db,'users/'+me.id),{avatar:na})};
 const closeEd=()=>{editor=false;renderMain()};
 $('#ex').onclick=closeEd;$('#dn').onclick=closeEd;
 m.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{edTab=+t.dataset.t;renderProfile(m)});
 m.querySelectorAll('.chip').forEach(c=>c.onclick=()=>setAv({...a,[c.dataset.k]:+c.dataset.i}));
 $('#rst').onclick=()=>setAv(defAv(me.gender));
 $('#rnd').onclick=()=>{const r={};CATS.forEach(([,gs])=>gs.forEach(([k,,v])=>r[k]=Math.floor(Math.random()*v.length)));setAv(r)};
}
</script></body></html>
